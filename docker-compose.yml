services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_dev
      POSTGRES_DB: mandate_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./audit/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://gateway:gateway_dev@postgres:5432/mandate_gateway
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      MANDATE_MASTER_KEY: ${MANDATE_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      GATEWAY_URL: http://gateway:8000
    depends_on:
      - gateway

  buyer-agent:
    build:
      context: ./buyer-agent
    environment:
      GATEWAY_URL: http://gateway:8000
      BUDGET: "50000"
      CATEGORY: "electronics"
    depends_on:
      - gateway

volumes:
  pgdata:
