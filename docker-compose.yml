services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_dev
      POSTGRES_DB: mandate_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./audit/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://gateway:gateway_dev@postgres:5432/mandate_gateway
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      MANDATE_MASTER_KEY: ${MANDATE_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      GATEWAY_URL: http://gateway:8000
      NODE_ENV: production
    depends_on:
      - gateway

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  buyer-agent:
    build:
      context: ./buyer-agent
    environment:
      GATEWAY_URL: http://gateway:8000
      REDIS_URL: redis://redis:6379
      AGENT_QUEUE: agent:tasks
      BUDGET: "5000000"
      CATEGORY: "electronics"
      AGENT_EMAIL: agent-001@buyer.local
      AGENT_TENANT: agent-001
      AGENT_PASSWORD: buyer-agent-secret
    depends_on:
      - gateway
      - redis

volumes:
  pgdata:
