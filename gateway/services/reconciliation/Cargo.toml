[package]
name = "reconciliation"
version = "0.1.0"
edition = "2024"
description = "Intent-vs-outcome mismatch detection and recovery"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
