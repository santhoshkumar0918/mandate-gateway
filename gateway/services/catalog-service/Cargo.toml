[package]
name = "catalog-service"
version = "0.1.0"
edition = "2024"
description = "Unified gateway server — mandates, purchases, catalog, audit"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

mandate-engine = { path = "../../crates/mandate-engine" }
policy-engine = { path = "../../crates/policy-engine" }
razorpay-client = { path = "../../crates/razorpay-client" }
reconciliation = { path = "../reconciliation" }
db = { path = "../../crates/db" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
hex = "0.4"
