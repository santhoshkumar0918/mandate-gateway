[package]
name = "policy-engine"
version = "0.1.0"
edition = "2024"
description = "Deterministic allow/block/escalate logic for mandate-gated payments"

[dependencies]
mandate-engine = { path = "../mandate-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
