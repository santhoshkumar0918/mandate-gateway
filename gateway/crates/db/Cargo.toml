[package]
name = "db"
version = "0.1.0"
edition = "2024"
description = "Postgres persistence layer for the Merchant Agent Gateway"

[dependencies]
mandate-engine = { path = "../mandate-engine" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
